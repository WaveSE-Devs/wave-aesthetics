<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:28px 32px;height:240px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .row{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--line);padding-bottom:14px}
  .row:last-child{border-bottom:0;padding-bottom:0}
  .spec{font:var(--t-spec);letter-spacing:.08em;text-transform:uppercase;color:var(--clay);min-width:160px}
  .sample{flex:1;letter-spacing:-.025em}
  .h1{font-family:var(--font-display);font-weight:600;font-size:46px;line-height:1}
  .h2{font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.05}
  .h3{font-family:var(--font-display);font-weight:500;font-size:22px;line-height:1.15}
</style></head>
<body>
  <div class="row"><div class="spec">H1 · Display 600 / 48</div><div class="sample h1">Built for fans, not feeds</div></div>
  <div class="row"><div class="spec">H2 · Display 500 / 30</div><div class="sample h2">A new episode every Friday</div></div>
  <div class="row"><div class="spec">H3 · Display 500 / 22</div><div class="sample h3">Hosted by Patrick Mahomes</div></div>
</body></html>
