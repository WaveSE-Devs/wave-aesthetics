<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:28px 32px;height:240px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .row{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding-bottom:14px}
  .row:last-child{border-bottom:0;padding-bottom:0}
  .spec{font:var(--t-spec);letter-spacing:.08em;text-transform:uppercase;color:var(--clay);min-width:160px}
  .sample{flex:1;font-family:var(--font-mono);font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--silver)}
  .lg{font-size:18px}
  .md{font-size:14px}
  .sm{font-size:12px}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--line);color:var(--silver)}
  .dot{width:8px;height:8px;border-radius:999px;background:var(--volt)}
</style></head>
<body>
  <div class="row"><div class="spec">Mono LG · 18 · Specs</div><div class="sample lg">FRI · NOV 14 · 9:00 PM ET</div></div>
  <div class="row"><div class="spec">Mono · 14 · Buttons</div><div class="sample md">WATCH NOW &nbsp; →</div></div>
  <div class="row"><div class="spec">Mono SM · 12 · Status</div><div class="sample sm"><span class="badge"><span class="dot"></span>LIVE · 12.4K WATCHING</span> &nbsp; EP. 04 / 12</div></div>
</body></html>
