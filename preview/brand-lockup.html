<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{display:flex;align-items:center;padding:0 32px;height:200px;background:var(--night)}
  .mark{display:flex;align-items:center;gap:24px;width:100%}
  .lockup{height:46px;display:flex;align-items:center}
  .lockup img{height:100%;width:auto;display:block}
  .meta{margin-left:auto;text-align:right}
  .meta .l{font:var(--t-spec);color:var(--clay);text-transform:uppercase;letter-spacing:.08em}
  .meta .v{font:var(--t-mono);color:var(--silver);margin-top:4px}
</style></head>
<body>
  <div class="mark">
    <div class="lockup">
      <img src="../assets/wave-primary-lockup-white.svg" alt="WAVE Sports & Entertainment">
    </div>
    <div class="meta">
      <div class="l">Primary lockup · B-to-B</div>
    </div>
  </div>
</body></html>
